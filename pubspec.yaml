name: lux_estate
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  filter_list: ^1.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_floating_bottom_bar: ^1.4.0
  flutter_map: ^8.2.2
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  fpdart: ^1.2.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  injectable: ^2.7.1+4
  intl: ^0.20.2
  latlong2: ^0.9.1
  path: ^1.9.1
  shimmer: ^3.0.0
  sqflite: ^2.4.2
  supabase_flutter: ^2.12.0

dev_dependencies:
  build_runner: ^2.13.1
  easy_localization_generator: ^0.3.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: 2.9.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/translations/
    - assets/fonts/

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/alexandria/Alexandria-Thin.ttf
          weight: 100
        - asset: assets/fonts/alexandria/Alexandria-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/alexandria/Alexandria-Light.ttf
          weight: 300
        - asset: assets/fonts/alexandria/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/alexandria/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/alexandria/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/alexandria/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/alexandria/Alexandria-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/alexandria/Alexandria-Black.ttf
          weight: 900

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/cairo/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/cairo/Cairo-ExtraBold.ttf
          weight: 800
