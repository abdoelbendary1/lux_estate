name: lux_estate
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  bloc_concurrency: ^0.3.0
  carousel_slider: ^5.1.2
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_floating_bottom_bar: ^1.4.0
  flutter_native_splash: ^2.4.7
  flutter_screenutil: ^5.9.3
  fpdart: ^1.2.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  injectable: ^2.7.1+4
  supabase_flutter: ^2.12.0

dev_dependencies:
  build_runner: ^2.13.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.12.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/alexandria/Alexandria-Thin.ttf
          weight: 100
        - asset: assets/fonts/alexandria/Alexandria-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/alexandria/Alexandria-Light.ttf
          weight: 300
        - asset: assets/fonts/alexandria/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/alexandria/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/alexandria/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/alexandria/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/alexandria/Alexandria-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/alexandria/Alexandria-Black.ttf
          weight: 900

    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
